[project]
name = "delonghi-mcp"
version = "0.6.0"
description = "MCP server for controlling De'Longhi Eletta Explore coffee maker via Ayla IoT"
readme = "README.md"
authors = [
    { name = "synthe102", email = "leonard@suslian.engineer" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]==1.27.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "typer==0.24.1",
]

[project.scripts]
delonghi-mcp = "delonghi_mcp.__main__:main"
delonghi = "delonghi_mcp.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits real Ayla API (requires DELONGHI_* env vars)"]
addopts = "-m 'not integration'"

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "respx==0.22.0", "ruff==0.17.4", "ty==0.0.28"]
